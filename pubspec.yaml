name: claimscope_clean
description: "A new Flutter project."
publish_to: "none"

version: 1.0.2+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  
  flutter:
   sdk: flutter
  flutter_localizations:
   sdk: flutter
  archive: ^3.6.1
  share_plus: ^10.1.0 
  intl: ^0.20.2
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  path_provider: ^2.1.5
  pdf: ^3.10.8
  pdf_combiner: 6.2.0
  image_picker: ^1.1.2
  cloud_functions: ^6.0.4
  url_launcher: ^6.3.2
  firebase_storage: ^13.0.5
  image: ^4.1.7
  crypto: ^3.0.7
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
 
flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
  assets:
    - assets/Icon/logo.png 
    - assets/fonts/Roboto-Regular.ttf  
    - assets/fonts/Roboto-Bold.ttf



    